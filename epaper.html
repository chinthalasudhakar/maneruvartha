<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఈ-పేపర్ - మానేరు వార్త</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #b71c1c;
            color: #ffffff;
            padding: 15px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }
        nav {
            background-color: #801313;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 12px;
            font-weight: 600;
            font-size: 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            text-align: center;
        }
        .epaper-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .epaper-card h2 {
            color: #b71c1c;
            margin-bottom: 15px;
            font-size: 22px;
        }
        .btn-download {
            display: inline-block;
            background-color: #b71c1c;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
        }
        .btn-download:hover {
            background-color: #801313;
        }
        .pdf-viewer {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 20px;
        }
        footer {
            background-color: #222;
            color: #ccc;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>మానేరు వార్త</h1>
        <p>నిజాయితీ గల వార్తలకు నిలువుటద్దం</p>
    </header>

    <nav>
        <a href="index.html">హోమ్</a>
        <a href="news.html">తాజా వార్తలు</a>
        <a href="epaper.html">ఈ-పేపర్</a>
    </nav>

    <div class="container">
        <div class="epaper-card">
            <h2>నేటి ఈ-పేపర్ ఎడిషన్</h2>
            <p><strong>తేదీ:</strong> అక్టోబర్ 25, 2026</p>
            
            <!-- పీడీఎఫ్ డౌన్‌లోడ్ లేదా నేరుగా ఓపెన్ చేసే బటన్ -->
            <a href="epaper.pdf" target="_blank" class="btn-download">ఈ-పేపర్ డౌన్‌లోడ్ చేసుకోండి (PDF)</a>

            <!-- మొబైల్/కంప్యూటర్‌లో నేరుగా PDF చూడటానికి ఫ్రేమ్ -->
            <iframe class="pdf-viewer" src="epaper.pdf"></iframe>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 మానేరు వార్త. సర్వహక్కులు ప్రత్యేకించబడ్డాయి.</p>
    </footer>

</body>
</html>
