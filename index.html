<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>మానేరు వార్త | ఈ-పేపర్</title>

  <!-- dFlip CSS -->
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    .header-bar {
      background: #0f172a;
      color: #fff;
      text-align: center;
      padding: 12px 10px;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 2px solid #e11d48;
    }
    #flipbook-container {
      height: 90vh;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    ఈ-పేపర్ - డిజిటల్ సంచిక
  </div>

  <div id="flipbook-container">
    <!-- మీ PDF ఫైల్ పేరు ఇక్కడ సరిగ్గా ఇవ్వండి -->
    <div class="_df_book" 
         id="my_epaper" 
         source="./epaper.pdf" 
         webgl="true">
    </div>
  </div>

  <!-- jQuery, PDF.js & dFlip JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

  <script>
    // PDF లోడింగ్ సెట్టింగ్స్
    var dFlipLocation = "https://cdn.jsdelivr.net/npm/dflip/";
  </script>

</body>
</html>
