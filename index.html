<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>మానేరు వార్త</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f8f9fa; }
        header { background: #b30000; color: white; padding: 20px; text-align: center; }
        .container { padding: 20px; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px; }
        h1 { margin: 0; font-size: 26px; }
        p { color: #444; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <h1>మానేరు వార్త</h1>
        <p style="color: #ffcccc; margin-top: 5px;">తాజా మరియు నిష్పక్షపాత వార్తలు</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>వెబ్‌సైట్‌కు స్వాగతం!</h2>
            <p>మానేరు వార్త అధికారిక వెబ్‌సైట్ త్వరలోనే పూర్తి వార్తలతో అందుబాటులోకి వస్తుంది.</p>
        </div>
    </div>
</body>
</html>
