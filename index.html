<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ఈ-పేపర్ | డిజిటల్ ఎడిషన్</title>

  <!-- Flipbook CSS (CDN ద్వారా) -->
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #2b2b2b;
      font-family: sans-serif;
    }
    .header-bar {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 12px 10px;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 2px solid #e60000;
    }
    #flipbook-container {
      height: 90vh;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    ఈ-పేపర్ - డిజిటల్ సంచిక
  </div>

  <!-- ఫ్లిప్‌బుక్ కంటైనర్ -->
  <div id="flipbook-container">
    <div class="_df_book" 
         id="my_epaper" 
         source="epaper.pdf" 
         webgl="true">
    </div>
  </div>

  <!-- jQuery & Flipbook JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

</body>
</html>
